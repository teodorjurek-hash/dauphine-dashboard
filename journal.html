<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Journal de bord — Dauphine</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="journal">
<div id="nav-placeholder"></div>

<main class="page">
  <h1 class="page-titre">Journal de bord</h1>
  <p class="page-soustitre">Une entrée par semaine : un rituel court pour garder le fil.</p>

  <form class="bento-carte" id="formulaire-journal" style="margin-bottom:20px;">
    <div class="champ">
      <label for="j-semaine">Semaine du</label>
      <input type="date" id="j-semaine" required />
    </div>
    <div class="champ">
      <label for="j-travaille">Ce que j'ai travaillé</label>
      <textarea id="j-travaille" rows="2"></textarea>
    </div>
    <div class="champ">
      <label for="j-marche">Ce qui a marché</label>
      <textarea id="j-marche" rows="2"></textarea>
    </div>
    <div class="champ">
      <label for="j-coince">Ce qui coince</label>
      <textarea id="j-coince" rows="2"></textarea>
    </div>
    <div class="champ">
      <label for="j-objectif">Objectif de la semaine suivante</label>
      <textarea id="j-objectif" rows="2"></textarea>
    </div>
    <button type="submit" class="bouton bouton-primaire">Enregistrer l'entrée</button>
  </form>

  <h2 class="page-titre" style="font-size:17px;">Historique</h2>
  <div id="liste-journal" style="margin-bottom:40px;"></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/calculs.js"></script>
<script src="js/util.js"></script>
<script src="js/storage.js"></script>
<script src="js/nav.js"></script>
<script src="js/journal.js"></script>
</body>
</html>
